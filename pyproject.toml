# 依存のみ。実行環境は uv.lock と Dockerfile で固定される。

[project]
name = "experiment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "hydra-core",
    "wandb",
    # CPU 版の torch を明示的に選ぶ。
    # この実験は未学習ネットワークの forward/backward を各 1 回行うだけで、
    # 学習も大きな行列積も無い。既定の PyPI wheel は CUDA 一式(nvidia-* と
    # triton で約 10GB)を引き込み、実行先の aarch64 向けイメージのビルドと
    # push がボトルネックになる。CPU 版なら CUDA も triton も不要になり、
    # イメージは 1GB 未満に収まる。実行ノードは 1 ジョブあたり 32 コアを
    # 割り当てるので、この規模なら CPU で十分間に合う。
    "torch==2.9.1",
    "numpy",
    "matplotlib",
]

# `src/` は `uv run python -m src.main` でリポジトリ root から実行され、
# 配布物としてインストールされることはない。
[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# 評価層 (AIRAS 管理)。報告される指標を再現可能にするためピンする。
# 実験コードは airas_eval を import してはならない — `make evaluate` /
# airas-eval CLI から eval_inputs のファイルに対してのみ起動される。
[dependency-groups]
eval = ["airas-eval==0.10.0"]
